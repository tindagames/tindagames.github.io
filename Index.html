<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tinda Games</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0f;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
    }

    .bg-grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(83,74,183,0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(83,74,183,0.08) 1px, transparent 1px);
      background-size: 60px 60px;
      z-index: 0;
    }

    .glow-orb {
      position: fixed;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(83,74,183,0.15) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 0;
      animation: pulse 4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
    }

    .center {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 2rem;
    }

    .icon {
      font-size: 64px;
      margin-bottom: 1.5rem;
      display: block;
      filter: drop-shadow(0 0 20px rgba(83,74,183,0.8));
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .title {
      font-family: 'Orbitron', monospace;
      font-size: clamp(3rem, 10vw, 7rem);
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 0.05em;
      text-shadow:
        0 0 20px rgba(83,74,183,0.9),
        0 0 60px rgba(83,74,183,0.5),
        0 0 100px rgba(83,74,183,0.3);
      line-height: 1;
    }

    .title span {
      color: #7F77DD;
    }

    .tagline {
      margin-top: 1.25rem;
      font-size: clamp(0.85rem, 2vw, 1rem);
      color: rgba(255,255,255,0.35);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      font-weight: 500;
    }

    .divider {
      width: 80px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #534AB7, transparent);
      margin: 1.5rem auto;
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="glow-orb"></div>
  <div class="center">
    <span class="icon">🎮</span>
    <h1 class="title">TINDA <span>GAMES</span></h1>
    <div class="divider"></div>
    <p class="tagline">Mobile Gaming Studio</p>
  </div>
</body>
</html>
